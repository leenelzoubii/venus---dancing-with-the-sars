# Team Venus — study areas and data filters
# Every script takes --aoi <name> (or --aoi-wkt "POLYGON((...))" for a one-off fallback).
# Coordinates are WGS84 (EPSG:4326), longitude latitude order, as in ASF Vertex.

active_aoi: dead_sea_east          # the AOI used by default (tonight's Gate 1)

aois:
  - name: dead_sea_east
    title: "Dead Sea — Jordanian east shore"
    story: >
      The east shore between Suweimeh and Ghor Haditha, just north of the Lisan peninsula.
      Two stories in one frame: shoreline retreat as the lake level falls, and the sinkhole belt
      on the Ghor Haditha plain. 100% Jordanian shore, inside the 12-day descending stack.
    # ~11 x 24 km -> about 550 x 1200 pixels at 20 m GCOV spacing.
    wkt: "POLYGON((35.500 31.340, 35.600 31.340, 35.600 31.560, 35.500 31.560, 35.500 31.340))"

