# --- Search filters (verified against the NISAR Data User Guide, Nov 2026) -------
search:
  dataset: NISAR            # asf_search dataset keyword
  processing_level: GCOV    # L2 geocoded polarimetric covariance (backscatter)
  data_maturity: PROVISIONAL  # PROVISIONAL | VALIDATED | BETA  (never mix within one series)
  start: "2026-06-17"       # first day of PROVISIONAL forward processing
  end: null                 # null = today
  # Preferred geometry, verified to give 9 PROVISIONAL dates over the Dead Sea:
  track: 151                # relative orbit
  frame: 73
  flight_direction: DESCENDING

# --- Processing parameters ------------------------------------------------------
processing:
  polarization: HH          # structural/texture layer; HV is the water-discrimination layer
  comparison_polarizations: [HH, HV]
  db: "10*log10(power)"     # GCOV diagonal terms are gamma-0 POWER, not amplitude.
                            # Confirmed by the product itself:
                            # ceosAnalysisReadyData/outputBackscatterDecibelConversionFormula
  speckle_filter: median    # median | boxcar | lee  (document the choice and size)
  speckle_window: 5         # pixels
  clip_percentiles: [2, 98] # display stretch
  pixel_spacing_m: 20       # verified: xCoordinateSpacing 20.0, yCoordinateSpacing -20.0

  # Water mapping. Measured over the Dead Sea: open water is about -13.7 dB in HH and -20.5 dB in
  # HV, so a textbook -20 dB rule is wrong for HH and a single fixed threshold cannot serve two
  # dates that differ by a scene-wide radiometric offset. "auto" = Otsu, computed per image.
  water_threshold: auto     # auto | a number in dB
  water_band_db: 1.5        # +/- sensitivity quoted alongside every reported water area

  # Speckle suppression before differencing: block-average in POWER (radiometrically correct),
  # 20 m -> 60 m. Without this a two-date difference image is almost pure speckle.
  multilook: 3
  remove_scene_offset: true # subtract the median of the difference and say so on the image

# --- Candidate patch detection (eastern plain) -----------------------------------
patches:
  threshold_db: 3.0        # |delta| above this counts as "changed" on a date
  min_consecutive: 2       # must be changed on this many CONSECUTIVE dates (suppresses speckle)
  min_area_px: 20          # at 60 m, 20 px is about 0.07 km2
  min_looks_percentile: 10 # drop pixels below this percentile of numberOfLooks
  connectivity: 8          # 8-connected components (diagonal neighbours touch)
