# Deploy the static web app to GitHub Pages.
#
# Only web/ is published. The pipeline, raw data and docs stay out of the site, and the app uses
# relative paths everywhere, so it works under /<repo-name>/ without any build step.
#
# Action versions verified against the GitHub API on 2026-11-14 (latest release tags):
#   actions/checkout v7.0.1, actions/configure-pages v6.0.0,
#   actions/upload-pages-artifact v5.0.0, actions/deploy-pages v5.0.1

name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the web folder as the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
